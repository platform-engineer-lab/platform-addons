apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-platform-app-red
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_dashboard_folder: Platform
data:
  app-red.json: "{\n  \"title\": \"Application RED\",\n  \"uid\": \"platform-app-red\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"editable\": true,\n  \"tags\": [\n    \"platform\",\n    \"otel\"\n  ],\n  \"time\": {\n    \"from\": \"now-1h\",\n    \"to\": \"now\"\n  },\n  \"refresh\": \"30s\",\n  \"panels\": [\n    {\n      \"title\": \"Request rate\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"mimir\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"mimir\"\n          },\n          \"expr\": \"sum(rate(traces_spanmetrics_calls_total{service=\\\"$service\\\",cluster=\\\"$cluster\\\"}[$__rate_interval]))\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"req/s\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {},\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {}\n    },\n    {\n      \"title\": \"Error rate\",\n      \"type\": \"stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"mimir\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 0,\n        \"w\": 6,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"mimir\"\n          },\n          \"expr\": \"100 * sum(rate(traces_spanmetrics_calls_total{service=\\\"$service\\\",cluster=\\\"$cluster\\\",status_code=\\\"STATUS_CODE_ERROR\\\"}[$__rate_interval])) / clamp_min(sum(rate(traces_spanmetrics_calls_total{service=\\\"$service\\\",cluster=\\\"$cluster\\\"}[$__rate_interval])),0.0001)\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"thresholds\": {\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 1\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 5\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {}\n    },\n    {\n      \"title\": \"Requests by status\",\n      \"type\": \"stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"mimir\"\n      },\n      \"gridPos\": {\n        \"x\": 18,\n        \"y\": 0,\n        \"w\": 6,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"mimir\"\n          },\n          \"expr\": \"sum by (status_code)(rate(traces_spanmetrics_calls_total{service=\\\"$service\\\",cluster=\\\"$cluster\\\"}[$__rate_interval]))\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"{{status_code}}\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {},\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {}\n    },\n    {\n      \"title\": \"Latency (p50 / p95 / p99)\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"mimir\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 8,\n        \"w\": 24,\n        \"h\": 9\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"mimir\"\n          },\n          \"expr\": \"histogram_quantile(0.50, sum by (le)(rate(traces_spanmetrics_latency_bucket{service=\\\"$service\\\",cluster=\\\"$cluster\\\"}[$__rate_interval])))\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"p50\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"mimir\"\n          },\n          \"expr\": \"histogram_quantile(0.95, sum by (le)(rate(traces_spanmetrics_latency_bucket{service=\\\"$service\\\",cluster=\\\"$cluster\\\"}[$__rate_interval])))\",\n          \"refId\": \"B\",\n          \"legendFormat\": \"p95\"\n        },\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"mimir\"\n          },\n          \"expr\": \"histogram_quantile(0.99, sum by (le)(rate(traces_spanmetrics_latency_bucket{service=\\\"$service\\\",cluster=\\\"$cluster\\\"}[$__rate_interval])))\",\n          \"refId\": \"C\",\n          \"legendFormat\": \"p99\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {},\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {}\n    }\n  ],\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"cluster\",\n        \"type\": \"query\",\n        \"datasource\": {\n          \"type\": \"prometheus\",\n          \"uid\": \"mimir\"\n        },\n        \"query\": {\n          \"query\": \"label_values(traces_spanmetrics_calls_total, cluster)\",\n          \"refId\": \"A\"\n        },\n        \"refresh\": 2,\n        \"includeAll\": false,\n        \"multi\": false,\n        \"current\": {}\n      },\n      {\n        \"name\": \"service\",\n        \"type\": \"query\",\n        \"datasource\": {\n          \"type\": \"prometheus\",\n          \"uid\": \"mimir\"\n        },\n        \"query\": {\n          \"query\": \"label_values(traces_spanmetrics_calls_total{cluster=\\\"$cluster\\\"}, service)\",\n          \"refId\": \"A\"\n        },\n        \"refresh\": 2,\n        \"includeAll\": false,\n        \"multi\": false,\n        \"current\": {}\n      }\n    ]\n  }\n}"
