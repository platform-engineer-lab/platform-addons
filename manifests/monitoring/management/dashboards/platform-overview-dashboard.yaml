  \"uid\": \"mimir\"\n      },\n      \"gridPos\": {\n        \"x\": 8,\n        \"y\": 0,\n        \"w\": 4,\n        \"h\": 5\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"mimir\"\n          },\n          \"expr\": \"sum(argocd_app_info{sync_status=\\\"Synced\\\"})\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"\",\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {}\n        },\n        \"overrides\": []\n      },\n      \"options\": {}\n    },\n    {\n      \"title\": \"Total request rate\",\n      \"type\": \"stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"mimir\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 0,\n        \"w\": 6,\n        \"h\": 5\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"mimir\"\n          },\n          \"expr\": \"sum(rate(traces_spanmetrics_calls_total[$__rate_interval]))\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {},\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {}\n    },\n    {\n      \"title\": \"Overall error rate\",\n      \"type\": \"stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"mimir\"\n      },\n      \"gridPos\": {\n        \"x\": 18,\n        \"y\": 0,\n        \"w\": 6,\n        \"h\": 5\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"mimir\"\n          },\n          \"expr\": \"100 * sum(rate(traces_spanmetrics_calls_total{status_code=\\\"STATUS_CODE_ERROR\\\"}[$__rate_interval])) / clamp_min(sum(rate(traces_spanmetrics_calls_total[$__rate_interval])),0.0001)\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"thresholds\": {\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"yellow\",\n                \"value\": 1\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 5\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {}\n    },\n    {\n      \"title\": \"Request rate by service / cluster\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"mimir\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 5,\n        \"w\": 24,\n        \"h\": 9\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"mimir\"\n          },\n          \"expr\": \"sum by (service, cluster)(rate(traces_spanmetrics_calls_total[$__rate_interval]))\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"{{service}} / {{cluster}}\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {},\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {}\n    },\n    {\n      \"title\": \"Log volume by cluster\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\": \"loki\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 14,\n        \"w\": 24,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\": \"loki\"\n          },\n          \"expr\": \"sum by (cluster)(count_over_time({cluster=~\\\".+\\\"}[$__auto]))\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"{{cluster}}\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {},\n          \"unit\": \"logs\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {}\n    }\n  ],\n  \"templating\": {\n    \"list\": []\n  }\n}"
