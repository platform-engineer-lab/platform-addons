apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-platform-argocd
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_dashboard_folder: Platform
data:
  argocd.json: "{\n  \"title\": \"Argo CD / GitOps\",\n  \"uid\": \"platform-argocd\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"editable\": true,\n  \"tags\": [\n    \"platform\",\n    \"gitops\"\n  ],\n  \"time\": {\n    \"from\": \"now-1h\",\n    \"to\": \"now\"\n  },\n  \"refresh\": \"30s\",\n  \"panels\": [\n    {\n      \"title\": \"Apps by health\",\n      \"type\": \"piechart\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"mimir\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 8,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"mimir\"\n          },\n          \"expr\": \"sum by (health_status)(argocd_app_info)\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"{{health_status}}\",\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {}\n        },\n        \"overrides\": []\n      },\n      \"options\": {}\n    },\n    {\n      \"title\": \"Apps by sync\",\n      \"type\": \"piechart\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"mimir\"\n      },\n      \"gridPos\": {\n        \"x\": 8,\n        \"y\": 0,\n        \"w\": 8,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"mimir\"\n          },\n          \"expr\": \"sum by (sync_status)(argocd_app_info)\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"{{sync_status}}\",\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {}\n        },\n        \"overrides\": []\n      },\n      \"options\": {}\n    },\n    {\n      \"title\": \"Sync operations (rate by phase)\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"mimir\"\n      },\n      \"gridPos\": {\n        \"x\": 16,\n        \"y\": 0,\n        \"w\": 8,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"mimir\"\n          },\n          \"expr\": \"sum by (phase)(rate(argocd_app_sync_total[$__rate_interval]))\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"{{phase}}\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {},\n          \"unit\": \"ops\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {}\n    },\n    {\n      \"title\": \"Applications\",\n      \"type\": \"table\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"mimir\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 8,\n        \"w\": 24,\n        \"h\": 10\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"mimir\"\n          },\n          \"expr\": \"sum by (name, project, health_status, sync_status)(argocd_app_info)\",\n          \"refId\": \"A\",\n          \"legendFormat\": \"\",\n          \"instant\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {}\n        },\n        \"overrides\": []\n      },\n      \"options\": {},\n      \"transformations\": [\n        {\n          \"id\": \"organize\",\n          \"options\": {\n            \"excludeByName\": {\n              \"Time\": true,\n              \"Value\": true\n            },\n            \"renameByName\": {\n              \"name\": \"Application\",\n              \"project\": \"Project\",\n              \"health_status\": \"Health\",\n              \"sync_status\": \"Sync\"\n            }\n          }\n        }\n      ]\n    }\n  ],\n  \"templating\": {\n    \"list\": []\n  }\n}"
