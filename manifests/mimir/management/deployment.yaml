apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: monitoring
  labels:
    app: mimir
spec:
  replicas: 1
  strategy:
    type: Recreate          # single RWO PVC — no rolling overlap
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
    spec:
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsNonRoot: true
      initContainers:
        # Copy rules into a clean emptyDir — ConfigMap volumes use ..data
        # symlinks that break Mimir's filesystem ruler-store <tenant>/<ns> walk.
        - name: copy-rules
          image: busybox:1.37
          # Mimir's ruler filesystem store keys the namespace as base64url; a
          # plainly-named file is never discovered. Name it base64("platform").
          command:
            - sh
            - -c
            - mkdir -p /rules/anonymous && cp /rules-cm/platform "/rules/anonymous/$(printf platform | base64)"
          volumeMounts:
            - name: rules-src
              mountPath: /rules-cm
            - name: rules
              mountPath: /rules
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
      containers:
        - name: mimir
          image: grafana/mimir:3.1.2
          # All of Mimir's relative default paths (./data-ruler, activity log,
          # etc.) resolve under the writable PVC instead of the read-only root.
          workingDir: /data
          args:
            - -config.file=/etc/mimir/mimir.yaml
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9095
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2560Mi
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
            # ruler_storage.filesystem.dir = /etc/mimir-rules; the init container
            # populates <dir>/anonymous/platform (tenant "anonymous").
            - name: rules
              mountPath: /etc/mimir-rules
      volumes:
        - name: config
          configMap:
            name: mimir-config
        - name: data
          persistentVolumeClaim:
            claimName: mimir-data
        - name: rules-src
          configMap:
            name: mimir-rules
        - name: rules
          emptyDir: {}
