# Grafana Mimir in monolithic mode (target: all) with filesystem block storage.
# The distributed chart (6+ pods + MinIO) doesn't fit the 16 GB lab VM; the
# monolith is still genuine Grafana Mimir, single process, ~700 MB.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: monitoring
data:
  mimir.yaml: |
    # `all` is the monolith set but excludes the ruler — add it explicitly so
    # alert rules are evaluated (alertmanager stays external: kube-prometheus-stack).
    target: all,ruler
    multitenancy_enabled: false

    # Default is ./metrics-activity.log — unwritable for the non-root user in
    # the read-only working dir; put it on the data volume.
    activity_tracker:
      filepath: /data/metrics-activity.log

    server:
      http_listen_port: 8080
      grpc_listen_port: 9095
      log_level: warn

    common:
      storage:
        backend: filesystem
        filesystem:
          dir: /data/blocks

    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/blocks
      bucket_store:
        sync_dir: /data/tsdb-sync
      tsdb:
        dir: /data/tsdb

    # Rules are loaded into this store by the mimir-rules-loader PostSync Job
    # (mimirtool → ruler API); the PVC persists them across restarts.
    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/ruler

    ruler:
      alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring:9093
      enable_api: true
      rule_path: /data/ruler-tmp        # writable scratch (PVC), not the rule store
      poll_interval: 1m                 # reload rules from the store every minute (default 10m)
      ring:
        kvstore:
          store: memberlist

    compactor:
      data_dir: /data/compactor
      sharding_ring:
        kvstore:
          store: memberlist

    ingester:
      ring:
        replication_factor: 1
        kvstore:
          store: memberlist

    store_gateway:
      sharding_ring:
        replication_factor: 1
        kvstore:
          store: memberlist

    distributor:
      ring:
        kvstore:
          store: memberlist

    memberlist:
      join_members: []

    limits:
      # Lab-scale ingestion headroom for two clusters' agents + span metrics.
      ingestion_rate: 100000
      ingestion_burst_size: 200000
      max_global_series_per_user: 0
      compactor_blocks_retention_period: 7d
