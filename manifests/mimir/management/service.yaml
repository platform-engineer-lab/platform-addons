apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimir-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: monitoring
  labels:
    app: mimir
spec:
  selector:
    app: mimir
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# Remote-write / query endpoint reachable from spoke agents inside the
# k3d-platform Docker network (NodePort not host-mapped).
apiVersion: v1
kind: Service
metadata:
  name: mimir-nodeport
  namespace: monitoring
  labels:
    app: mimir
spec:
  type: NodePort
  selector:
    app: mimir
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30091
