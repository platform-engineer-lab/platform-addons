# Single-binary Tempo for the lab: local filesystem trace storage, OTLP in.
tempo:
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
  retention: 72h
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

  # Metrics-generator: derive RED span metrics + a service graph from traces and
  # remote-write them to Mimir. Powers Argo Rollouts canary analysis and the
  # Grafana serviceMap / tracesToMetrics / node-graph correlations.
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://mimir:8080/api/v1/push
    processor:
      span_metrics:
        # dev and prod both report service="spring-service" — a cluster label is
        # required or their span metrics collide in Mimir.
        dimensions:
          - cluster

  # overrides.defaults activates the generator processors for the (anonymous) tenant.
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics

persistence:
  enabled: true
  size: 5Gi
