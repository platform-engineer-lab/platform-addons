# Observability hub: Prometheus (remote-write receiver for the spokes) + Grafana.
alertmanager:
  enabled: false

prometheus:
  service:
    # Reachable from spoke clusters inside the k3d-platform Docker network
    # (not mapped to a host port).
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    enableRemoteWriteReceiver: true
    externalLabels:
      cluster: management
    retention: 24h
    # Select every ServiceMonitor/PodMonitor in the cluster, not only
    # helm-release-labelled ones (we ship custom monitors in monitoring-config).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki:3100
      access: proxy
      jsonData:
        # A trace id in a log line links straight to the Tempo trace.
        derivedFields:
          - name: TraceID
            matcherRegex: '"trace_id":"(\w+)"'
            url: '$${__value.raw}'
            datasourceUid: tempo
    # Mimir is the long-term, multi-cluster metrics store (Prometheus-compatible
    # query API). Made default so existing dashboards query it transparently.
    - name: Mimir
      type: prometheus
      uid: mimir
      url: http://mimir:8080/prometheus
      access: proxy
      isDefault: true
      jsonData:
        timeInterval: 30s
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo:3200
      access: proxy
      jsonData:
        # Correlate a span to its logs (Loki) and RED metrics (Mimir).
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
          tags: [{ key: 'service.name', value: 'app' }]
        tracesToMetrics:
          datasourceUid: mimir
        serviceMap:
          datasourceUid: mimir
        nodeGraph:
          enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  sidecar:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    datasources:
      # Mimir is the default datasource (above); don't also provision the
      # chart's built-in in-cluster Prometheus as default.
      defaultDatasourceEnabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # Rendered admission webhook jobs also need limits (kyverno Enforce).
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
